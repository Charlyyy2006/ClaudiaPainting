  <script type="application/ld+json">

    "priceRange": "$$",
    "areaServed": "United States",
    "knowsLanguage": ["en", "es"],
    "openingHoursSpecification": [{
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],

    }],

  <style>
    html, body { margin: 0; background: #0F1115; }
    /* Pantalla de carga: se ve al instante mientras arranca Flutter
       y se quita sola con el primer cuadro de la app. */
    #carga {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; padding: 24px; text-align: center;
      background: #0F1115; color: #fff;
      font-family: Georgia, 'Times New Roman', serif;
      transition: opacity .35s ease;
    }
    #carga img { width: min(240px, 60vw); height: auto; }
    #carga h1 { font-weight: 400; font-size: clamp(24px, 5vw, 34px); line-height: 1.15; margin: 0; max-width: 18ch; }
    #carga p { font: 15px/1.6 system-ui, -apple-system, sans-serif; color: rgba(255,255,255,.6); margin: 0; max-width: 42ch; }
    #carga a { color: #25D366; font-weight: 600; text-decoration: none; }
    #carga .barra { width: 120px; height: 2px; background: rgba(255,255,255,.12); overflow: hidden; border-radius: 2px; }
    #carga .barra::after {
      content: ""; display: block; height: 100%; width: 40%;
      background: linear-gradient(90deg,#2f6fd0,#3c8fa0,#4f8a45,#d6a63a,#d2762f,#c1543a);
      animation: corre 1.1s ease-in-out infinite;
    }
    @keyframes corre { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #carga .barra::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="carga">
    <img src="icons/logo-carga.png" alt="Claudia Painting LLC — We Paint. You Love. We Care." width="760" height="432">
    <h1>Residential interior &amp; exterior painting</h1>
    <p>Clean, careful work and honest prices. Free estimates · Se habla español.
       <br><a href="https://wa.me/15043392155">WhatsApp +1 (504) 339-2155</a></p>
    <div class="barra" aria-hidden="true"></div>
    <noscript><p>This site needs JavaScript. Call or WhatsApp us at +1 (504) 339-2155 or +1 (629) 207-2652.</p></noscript>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var c = document.getElementById('carga');
      if (!c) return;
      c.style.opacity = '0';
      setTimeout(function () { c.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
