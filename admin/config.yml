## ══════════════════════════════════════════════════════════
##  Panel de fotos — Claudia Painting LLC
##
##  IMPORTANTE: en este archivo NO hay ninguna contraseña ni
##  llave secreta, y no debe haberla nunca. Es un archivo
##  público. La llave de acceso vive en el Cloudflare Worker.
##
##  Quién puede publicar lo decide la lista de colaboradores
##  del repositorio en GitHub, no este archivo.
## ══════════════════════════════════════════════════════════

backend:
  name: github

  repo: Charlyyy2006/ClaudiaPainting

  branch: main

  ## el Cloudflare Worker que autoriza la entrada.
  ## Aquí no hay ningún secreto: la llave vive dentro del Worker.
  base_url: https://sveltia-cms-auth.charlymejia2006.workers.dev

  ## mensaje que queda en el historial con cada cambio,
  ## así siempre se sabe quién subió o borró qué foto
  commit_messages:
    create: 'Agrega {{collection}} "{{slug}}" ({{author-name}})'
    update: 'Actualiza {{collection}} "{{slug}}" ({{author-name}})'
    delete: 'Borra {{collection}} "{{slug}}" ({{author-name}})'
    uploadMedia: 'Sube la imagen "{{path}}" ({{author-name}})'
    deleteMedia: 'Borra la imagen "{{path}}" ({{author-name}})'

## ── Apariencia del panel ───────────────────────────────────
## Se usa una versión del logo sobre fondo oscuro porque el
## logo original es blanco sobre transparente: en el tema
## claro del panel sería invisible. Así se ve bien siempre.
logo:
  src: /admin/logo-panel.png

## reemplaza el texto "Sveltia CMS" de la pantalla de entrada
app_title: Claudia Painting

## a dónde van las fotos que ella suba
media_folder: fotos
public_folder: /fotos

## Limpia el nombre del archivo al subirlo: quita acentos, eñes y
## signos raros. Así una foto llamada "Casa Señora Pérez (1).jpg"
## se guarda como "casa-senora-perez-1.jpg" y no rompe la dirección
## web. Ella no tiene que renombrar nada a mano.
media_libraries:
  default:
    config:
      slugify_filename: true

## se muestra el sitio real al dar clic en "Ver el sitio"
site_url: https://claudiapainting.com

collections:
  - name: galeria
    label: 1 · Galería de fotos
    files:
      - name: fotos
        label: 1 · Galería de fotos
        file: datos/galeria.json
        icon: photo_library
        description: >-
          ESTA ES LA CUADRÍCULA DE FOTOS SUELTAS, la sección de la página que
          dice "Una galería de casas reales", con los filtros de Interiores /
          Exteriores / Proceso.
          Aquí va UNA foto por tarjeta.
          Si lo que quiere es publicar un antes y un después juntos, use la
          otra sección del menú: "2 · Antes y después".
          Para cambiar el orden en que salen, arrastre las tarjetas. Para
          borrar una foto, use la X de su tarjeta y luego guarde.
        fields:
          - name: fotos
            label: Fotos
            label_singular: Foto
            widget: list
            allow_add: true
            collapsed: true
            summary: '{{fields.titulo_es}}'
            fields:

              - name: imagen
                label: Foto
                widget: image
                required: true
                hint: >-
                  Elija una foto de la computadora o del celular. Lo ideal es
                  que no pese más de 500 KB para que la página cargue rápido.

              - name: titulo_es
                label: Título (español)
                widget: string
                required: true
                hint: 'Ejemplo: Sala con techo alto'

              - name: descripcion_es
                label: Descripción corta (español)
                widget: string
                required: true
                hint: 'Ejemplo: Interior · Gris cálido, techo incluido'

              - name: titulo_en
                label: Título (inglés)
                widget: string
                required: true
                hint: 'Ejemplo: Vaulted living room'

              - name: descripcion_en
                label: Descripción corta (inglés)
                widget: string
                required: true
                hint: 'Ejemplo: Interior · Warm greige, ceiling included'

              - name: categorias
                label: Categorías
                widget: select
                multiple: true
                required: true
                default: ['interior']
                hint: >-
                  Decide en qué filtros aparece la foto. Puede marcar más de
                  una: por ejemplo una foto de preparación de una fachada va
                  en "Exteriores" y en "Proceso".
                options:
                  - { label: 'Interiores', value: 'interior' }
                  - { label: 'Exteriores', value: 'exterior' }
                  - { label: 'Proceso (preparación / antes)', value: 'proceso' }

              - name: forma
                label: Forma de la miniatura
                widget: select
                required: true
                default: '3/4'
                hint: >-
                  Cómo se recorta la foto en la cuadrícula. Combinar formas
                  distintas hace que la galería se vea más bonita.
                options:
                  - { label: 'Alta (3/4)', value: '3/4' }
                  - { label: 'Media (4/5)', value: '4/5' }
                  - { label: 'Cuadrada (1/1)', value: '1/1' }

  ## ════════════════════════════════════════════════════════
  - name: antes-despues
    label: 2 · Antes y después
    files:
      - name: proyectos
        label: 2 · Antes y después
        file: datos/antes-despues.json
        icon: compare
        description: >-
          ESTA ES LA SECCIÓN DE PAREJAS DE FOTOS, la que en la página dice
          "Antes y después".
          Cada tarjeta lleva DOS fotos del mismo lugar: cómo estaba antes y
          cómo quedó al terminar.
          Procure que las dos fotos estén tomadas desde el mismo ángulo, así
          se aprecia mejor el cambio.
          Si solo tiene una foto suelta, va en la otra sección del menú:
          "1 · Galería de fotos".
        fields:
          - name: proyectos
            label: Proyectos
            label_singular: Proyecto
            widget: list
            allow_add: true
            collapsed: true
            summary: '{{fields.titulo_es}}'
            fields:

              - name: imagen_antes
                label: Foto de ANTES
                widget: image
                required: true
                hint: Cómo estaba el lugar antes de empezar a pintar.

              - name: imagen_despues
                label: Foto de DESPUÉS
                widget: image
                required: true
                hint: El mismo lugar ya terminado.

              - name: titulo_es
                label: Título (español)
                widget: string
                required: true
                hint: 'Ejemplo: Recámara y techo de madera'

              - name: descripcion_es
                label: Descripción (español)
                widget: text
                required: true
                hint: >-
                  Dos o tres renglones contando qué se hizo. Máximo 600
                  caracteres.

              - name: etiquetas_es
                label: Etiquetas (español)
                widget: list
                required: false
                max: 3
                hint: >-
                  Hasta 3 palabras cortas que salen como pastillas debajo del
                  texto. Ejemplo: Interior · Repintado completo · Techo incluido

              - name: titulo_en
                label: Título (inglés)
                widget: string
                required: true
                hint: 'Ejemplo: Bedroom & wood ceiling'

              - name: descripcion_en
                label: Descripción (inglés)
                widget: text
                required: true

              - name: etiquetas_en
                label: Etiquetas (inglés)
                widget: list
                required: false
                max: 3
                hint: 'Las mismas 3 etiquetas, en inglés.'
